<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمل - منظومة إدارة التعليم الذكي</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#1a252f">
    <meta name="apple-mobile-web-app-title" content="أمل">
    <link rel="apple-touch-icon" href="https://img.icons8.com/?size=192&id=103366&format=png&color=2C3E50">

    <style>
        :root {
            --primary-color: #2c3e50;      
            --secondary-color: #d4af37;    
            --accent-color: #4a6b82;       
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --whatsapp-color: #25D366;
            --light-bg: #f5f7fa;
            --dark-text: #2c3e50;
            --amal-gradient: linear-gradient(135deg, #bfe3ed 0%, #ecdcd1 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            background: var(--amal-gradient);
            background-attachment: fixed;
            color: var(--dark-text);
        }

        .login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--amal-gradient);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; padding: 20px; box-sizing: border-box;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.75); 
            padding: 30px 20px; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            text-align: center; max-width: 100%; width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }

        .login-logo-sim {
            font-size: 42px; font-weight: bold; color: #fff;
            text-shadow: 1px 1px 10px rgba(0,0,0,0.1); margin-bottom: 10px;
            background: linear-gradient(45deg, #4a6b82, #2c3e50);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .login-box h2 { color: var(--primary-color); font-size: 24px; font-weight: 800; margin: 0 0 10px 0; }

        .header {
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: var(--primary-color); padding: 20px 15px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative;
        }

        .header h1 { margin: 0; font-size: 28px; font-weight: 800; color: var(--primary-color); }

        .teacher-badge-header {
            background-color: var(--primary-color); color: #fff; 
            padding: 6px 16px; border-radius: 20px; display: inline-block; 
            font-size: 13px; margin-top: 10px; font-weight: bold;
        }

        .container { max-width: 1200px; margin: 15px auto; padding: 0 15px; box-sizing: border-box; }

        .tabs { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }

        .tab-btn {
            flex: 1; padding: 12px 8px; font-size: 13px; font-weight: bold;
            cursor: pointer; border: none; border-radius: 12px;
            background-color: rgba(255,255,255,0.7); color: var(--primary-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: all 0.3s; white-space: nowrap;
        }

        .tab-btn.active, .tab-btn:hover { background-color: var(--primary-color); color: #fff; transform: translateY(-2px); } 
        
        .panel {
            display: none; background: rgba(255, 255, 255, 0.85); padding: 20px;
            border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.03);
            border: 1px solid rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .panel.active { display: block; }

        h2 { color: var(--primary-color); border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 10px; margin-top: 0; font-weight: 700; font-size: 18px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #4a5568; font-size: 14px; }

        input, select {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; 
            box-sizing: border-box; font-size: 14px; transition: all 0.2s; background-color: rgba(255,255,255,0.9);
        }
        input:focus, select:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1); }

        .date-picker-box { background: rgba(255,255,255,0.6); padding: 15px; border-radius: 12px; margin-bottom: 20px; border-right: 5px solid var(--primary-color); }

        button.btn-submit {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); color: white;
            border: none; padding: 14px 20px; border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; transition: all 0.2s;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
        @media(min-width: 600px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }

        .stat-card {
            background: #fff; padding: 15px; border-radius: 14px; text-align: center; border-top: 4px solid var(--primary-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.01); font-size: 14px;
        }
        .stat-card.success { border-top-color: var(--success-color); }
        .stat-card.danger { border-top-color: var(--danger-color); }
        .stat-number { font-size: 20px; font-weight: 800; margin-top: 6px; color: #1e293b; }

        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 15px; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.02); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; background: #fff;}
        th, td { padding: 12px 10px; text-align: right; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        th { background-color: #f8fafc; color: var(--primary-color); font-weight: 700; }

        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; display: inline-block;}
        .status-present { background-color: #d4edda; color: #155724; }
        .status-absent { background-color: #f8d7da; color: #721c24; }
        .status-none { background-color: #e2e3e5; color: #383d41; }

        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; transition: all 0.2s; margin: 2px;}
        .btn-p { background-color: var(--success-color); color: white; }
        .btn-a { background-color: var(--danger-color); color: white; }
        .btn-del { background-color: #94a3b8; color: white; }
        .btn-wa { background-color: var(--whatsapp-color); color: white; display: inline-flex; align-items: center; gap: 4px; }
        
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); display: flex; justify-content: center;
            align-items: center; font-size: 18px; font-weight: bold; color: var(--primary-color);
            z-index: 9999; backdrop-filter: blur(5px);
        } 
        
        .logout-btn {
            background-color: var(--danger-color); color: white; border: none;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;
            position: absolute; left: 15px; top: 22px;
        }
    </style>
</head>
<body>

    <div id="login-panel" class="login-screen">
        <div class="login-box">
            <div class="login-logo-sim">أمل</div>
            <h2>منظومة إدارة التعليم الذكي</h2>
            <p style="color: #64748b; margin-bottom: 20px; font-size: 13px; font-weight: 500;">يرجى كتابة رمز الوصول المخصص لك</p>
            <input type="password" id="secret-pin" placeholder="الرمز السري الخاص بك" style="text-align: center; font-size: 18px; margin-bottom: 15px;"><br>
            <button class="btn-submit" onclick="verifyAccess()">تسجيل الدخول الآمن</button>
        </div>
    </div>

    <div id="loading" class="loading-overlay" style="display: none;">جاري الاتصال بالسحابة الآمنة...</div>

    <div id="main-content" style="display: none;">
        <div class="header">
            <button class="logout-btn" onclick="logout()">خروج</button>
            <h1>أمل</h1>
            <p id="user-welcome-msg" style="margin: 5px 0 0 0; color: #555; font-size: 13px;">منظومة إدارة التعليم الذكي الموحدة</p>
            <div id="teacher-tag" class="teacher-badge-header" style="display: none;"></div>
        </div>

        <div class="container">
            <div class="tabs" id="main-tabs">
                <button class="tab-btn active" onclick="switchTab('students-panel')">إدارة الطلاب</button>
