<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمل</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="#1a252f">
    <meta name="apple-mobile-web-app-title" content="أمل">
    <link rel="apple-touch-icon" href="https://img.icons8.com/?size=192&id=103366&format=png&color=2C3E50">

    <style>
        :root { --primary-color: #1a252f; --secondary-color: #d4af37; --success-color: #2ecc71; --danger-color: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f5f7fa; color: #2c3e50; }

        /* شاشة تسجيل الدخول */
        .login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.ibb.co/6RFF2X6v/image-33.png') no-repeat center center;
            background-size: cover; display: flex; justify-content: center; align-items: center; z-index: 10000;
        }
        .login-box { background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 24px; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }

        /* الواجهة الداخلية الأصلية */
        #main-content { display: none; padding: 20px; }
        .header { background: linear-gradient(135deg, #1a252f, #2c3e50); color: white; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
        .panel { display: none; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .panel.active { display: block; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: right; }
    </style>
</head>
<body>

    <div id="login-panel" class="login-screen">
        <div class="login-box">
            <h2>تطبيق أمل</h2>
            <input type="password" id="secret-pin" placeholder="الرمز السري">
            <button onclick="verifyAccess()" style="background: #1a252f; color: white; width: 100%; margin-top: 15px;">دخول</button>
        </div>
    </div>

    <div id="main-content">
        <div class="header"><h1>أمل</h1></div>
        <div id="tabs" style="text-align: center; margin-bottom: 20px;">
            <button onclick="switchTab('students-panel')">الطلاب</button>
            <button onclick="switchTab('attendance-panel')">الغياب</button>
        </div>
        
        <div id="students-panel" class="panel active">
            <h2>إدارة الطلاب</h2>
            <input type="text" id="st-name" placeholder="اسم الطالب">
            <button onclick="addStudent()">إضافة</button>
            <table id="students-table"></table>
        </div>

        <div id="attendance-panel" class="panel">
            <h2>سجل الحضور</h2>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyDXjoZiN7LeNCtvQlMyDHSopHDGrVnpIxY",
            projectId: "success-institute-4c8e4"
        }));

        window.verifyAccess = () => {
            if(document.getElementById('secret-pin').value === "1234") {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else { alert("رمز خطأ"); }
        }

        window.switchTab = (id) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        window.addStudent = async () => {
            const name = document.getElementById('st-name').value;
            await addDoc(collection(db, "students"), { name });
        }

        onSnapshot(collection(db, "students"), (snap) => {
            const table = document.getElementById('students-table');
            table.innerHTML = "<tr><th>الاسم</th></tr>";
            snap.forEach(d => table.innerHTML += `<tr><td>${d.data().name}</td></tr>`);
        });
    </script>
</body>
</html>
