<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمل</title>
    <link rel="apple-touch-icon" href="https://img.icons8.com/?size=192&id=103366&format=png&color=2C3E50">
    <style>
        :root { --primary: #4a6b82; --secondary: #d4af37; --success: #2ecc71; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8fafc; }

        /* خلفية شاشة الدخول فقط */
        .login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://i.ibb.co/6RFF2X6v/image-33.png') no-repeat center center;
            background-size: cover; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box { background: rgba(255,255,255,0.9); padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

        /* واجهة التطبيق (بيضاء ونظيفة) */
        #main-content { display: none; background: #fff; min-height: 100vh; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .panel { padding: 20px; display: none; }
        .panel.active { display: block; }
        .tab-btn { padding: 10px 15px; margin: 5px; cursor: pointer; border-radius: 8px; border: none; background: #e2e8f0; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: right; }
    </style>
</head>
<body>

    <div id="login-panel" class="login-screen">
        <div class="login-box">
            <h2>تطبيق أمل</h2>
            <input type="password" id="secret-pin" placeholder="الرمز السري">
            <button class="btn-submit" onclick="verifyAccess()">تسجيل الدخول</button>
        </div>
    </div>

    <div id="main-content">
        <div class="header"><h1>أمل</h1></div>
        <div style="text-align:center; padding:10px;">
            <button class="tab-btn active" onclick="switchTab('students')">الطلاب</button>
            <button class="tab-btn" onclick="switchTab('attendance')">الغياب</button>
        </div>

        <div id="students" class="panel active">
            <h2>إدارة الطلاب</h2>
            <input type="text" id="st-name" placeholder="اسم الطالب">
            <input type="number" id="st-fee" placeholder="القسط">
            <button class="btn-submit" onclick="addStudent()">إضافة</button>
            <table id="students-table"></table>
        </div>

        <div id="attendance" class="panel">
            <h2>سجل الغياب</h2>
            <table id="attendance-table"></table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXjoZiN7LeNCtvQlMyDHSopHDGrVnpIxY",
            projectId: "success-institute-4c8e4"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        window.verifyAccess = () => {
            if(document.getElementById('secret-pin').value === "1234") {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else { alert("رمز خطأ!"); }
        }

        window.switchTab = (tab) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        window.addStudent = async () => {
            const name = document.getElementById('st-name').value;
            await addDoc(collection(db, "students"), { name });
            alert("تمت الإضافة!");
        }

        onSnapshot(collection(db, "students"), (snap) => {
            const table = document.getElementById('students-table');
            table.innerHTML = `<tr><th>الاسم</th></tr>`;
            snap.forEach(doc => {
                table.innerHTML += `<tr><td>${doc.data().name}</td></tr>`;
            });
        });
    </script>
</body>
</html>
